<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=Fraunces:opsz,wght@9..144,400;9..144,600&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  width: 1200px;
  height: 630px;
  background: #ffffff;
  font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
}
.card {
  text-align: center;
  max-width: 760px;
}
.logo {
  font-size: 32px;
  font-weight: 400;
  color: #0D1321;
  letter-spacing: 0.5px;
  margin-bottom: 40px;
}
.tagline {
  font-family: 'Fraunces', Georgia, 'Times New Roman', serif;
  font-size: 52px;
  font-weight: 400;
  color: #0D1321;
  line-height: 1.1;
  letter-spacing: -1.5px;
  margin-bottom: 24px;
}
.tagline strong {
  font-weight: 600;
}
.sub {
  font-size: 18px;
  color: #3E5C76;
  line-height: 1.6;
  letter-spacing: 0.01em;
}
</style>
</head>
<body>
  <div class="card">
    <div class="logo">clearisk</div>
    <div class="tagline">Une vision claire de<br><strong>tous</strong> vos risques.</div>
    <div class="sub">Centralisez, évaluez et priorisez les risques de votre entreprise.</div>
  </div>
</body>
</html>

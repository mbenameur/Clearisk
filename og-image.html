<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  width: 1200px;
  height: 630px;
  background: #ffffff;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 1px solid #E2E8F0;
}
.card {
  text-align: center;
  max-width: 700px;
}
.logo {
  font-size: 48px;
  font-weight: 500;
  color: #1D2D44;
  letter-spacing: -1px;
  margin-bottom: 28px;
}
.logo span { color: #748CAB; }
.divider {
  width: 40px;
  height: 2px;
  background: #E2E8F0;
  margin: 0 auto 28px;
}
.tagline {
  font-size: 22px;
  font-weight: 400;
  color: #0D1321;
  line-height: 1.4;
  letter-spacing: -0.3px;
  margin-bottom: 20px;
}
.sub {
  font-size: 15px;
  color: #748CAB;
  letter-spacing: 0.02em;
}
.badge {
  display: inline-block;
  margin-top: 32px;
  font-size: 12px;
  font-weight: 500;
  color: #748CAB;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  padding: 6px 16px;
  border: 1px solid #E2E8F0;
  border-radius: 20px;
}
</style>
</head>
<body>
  <div class="card">
    <div class="logo">clear<span>isk</span></div>
    <div class="divider"></div>
    <div class="tagline">La gestion des risques,<br>enfin simple.</div>
    <div class="sub">Identifiez vos risques. Agissez maintenant.</div>

  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bienvenue — Clearisk</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; background: #F4F6F9; color: #1A1A1A; min-height: 100vh; display: flex; flex-direction: column; }

.nav { background: #fff; padding: 0 4rem; height: 64px; display: flex; align-items: center; border-bottom: 1px solid #E2E8F0; }
.nav-logo { font-size: 28px; font-weight: 500; color: #0A1F3D; letter-spacing: -0.5px; text-decoration: none; }
.nav-logo span { color: #94A3B8; }
.nav-tagline { font-size: 10px; color: #94A3B8; padding-left: 14px; border-left: 1px solid #E2E8F0; letter-spacing: 0.02em; }

.content { flex: 1; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
.container { max-width: 520px; width: 100%; }

.card { background: #fff; border-radius: 14px; border: 1px solid #E2E8F0; padding: 2.5rem; text-align: center; }

.welcome-label { font-size: 10px; font-weight: 500; color: #94A3B8; text-transform: uppercase; letter-spacing: 0.12em; margin-bottom: 1rem; }
.welcome-title { font-size: 26px; font-weight: 400; color: #1A1A1A; letter-spacing: -0.4px; margin-bottom: 6px; line-height: 1.3; }
.welcome-title strong { color: #0A1F3D; font-weight: 500; }
.welcome-sub { font-size: 13px; color: #94A3B8; line-height: 1.7; margin-bottom: 2rem; }

.divider { height: 1px; background: #E2E8F0; margin: 1.5rem 0; }

.question { font-size: 15px; font-weight: 500; color: #0A1F3D; margin-bottom: 1rem; }

.choices { display: flex; flex-direction: column; gap: 10px; }

.choice { border-radius: 11px; padding: 20px 22px; cursor: pointer; transition: transform 0.18s cubic-bezier(.34,1.3,.64,1), box-shadow 0.18s; text-align: left; border: none; width: 100%; font-family: inherit; }
.choice:hover { transform: scale(1.02); box-shadow: 0 6px 20px rgba(10,31,61,.10); }

.choice-primary { background: #0A1F3D; }
.choice-primary .choice-title { font-size: 15px; font-weight: 500; color: #fff; margin-bottom: 6px; }
.choice-primary .choice-sub { font-size: 12px; color: rgba(255,255,255,.6); line-height: 1.6; }
.choice-primary .choice-badge { display: inline-block; font-size: 10px; font-weight: 500; background: #EAFAF3; color: #1D9E75; padding: 2px 10px; border-radius: 20px; margin-bottom: 8px; }

.choice-secondary { background: #F8FAFC; border: 1.5px solid #E2E8F0; }
.choice-secondary .choice-title { font-size: 15px; font-weight: 500; color: #0A1F3D; margin-bottom: 6px; }
.choice-secondary .choice-sub { font-size: 12px; color: #71869A; line-height: 1.6; }

.loading { text-align: center; padding: 2rem 0; }
.loading-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #0A1F3D; margin: 0 3px; animation: bounce 1.2s infinite; }
.loading-dot:nth-child(2) { animation-delay: 0.2s; }
.loading-dot:nth-child(3) { animation-delay: 0.4s; }
@keyframes bounce { 0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; } 40% { transform: scale(1); opacity: 1; } }

/* FOOTER */
.footer-wrap { max-width: 1100px; margin: 0 auto; border-top: 1px solid #E2E8F0; }
.footer { padding: 2rem 4rem; display: flex; align-items: flex-start; justify-content: space-between; }
.footer-logo { font-size: 18px; font-weight: 500; color: #0A1F3D; margin-bottom: 4px; }
.footer-logo span { color: #94A3B8; }
.footer-sub { font-size: 11px; color: #94A3B8; margin-bottom: 3px; }
.footer-trademark { font-size: 10px; color: #B8C4D0; margin-bottom: 6px; font-style: italic; }
.footer-right { display: flex; align-items: center; gap: 18px; }
.fi { display: flex; align-items: center; cursor: pointer; text-decoration: none; }
.fi svg { width: 18px; height: 18px; fill: #94A3B8; transition: fill 0.15s; }
.fi:hover svg { fill: #0A1F3D; }
.footer-mail { font-size: 12px; color: #94A3B8; text-decoration: none; transition: color 0.15s; line-height: 18px; }
.footer-mail:hover { color: #0A1F3D; }
.footer-legal-inline { font-size: 11px; color: #94A3B8; margin-top: 4px; }
.footer-legal-inline a { color: #94A3B8; text-decoration: none; transition: color 0.15s; }
.footer-legal-inline a:hover { color: #0A1F3D; }

/* MODAL */
.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(10,31,61,0.35); z-index: 200; align-items: center; justify-content: center; padding: 1.5rem; }
.modal-overlay.open { display: flex; }
.modal { background: #fff; border-radius: 12px; border: 1px solid #E2E8F0; max-width: 640px; width: 100%; max-height: 80vh; overflow-y: auto; padding: 2.5rem; position: relative; }
.modal-close { position: absolute; top: 1.25rem; right: 1.25rem; background: none; border: none; font-size: 20px; color: #94A3B8; cursor: pointer; line-height: 1; }
.modal-close:hover { color: #0A1F3D; }
.modal h2 { font-size: 18px; font-weight: 500; color: #0A1F3D; }

@media (max-width: 700px) {
  .nav { padding: 0 1.5rem; }
  .nav-tagline { display: none; }
  .content { padding: 2rem 1.25rem; align-items: flex-start; }
  .card { padding: 1.75rem; }
  .footer { padding: 1.5rem 2rem; flex-direction: column; gap: 1.25rem; align-items: flex-start; }
}
</style>
</head>
<body>

<nav class="nav">
  <div style="display:flex;align-items:center;gap:14px;">

<!-- MODAL -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModalOutside(event)">
  <div class="modal" id="modalBox">
    <button class="modal-close" onclick="closeModal()">×</button>
    <div id="modalContent"></div>
  </div>
</div>

<script>
var SUPABASE_URL = 'https://ycakrdaxsvxbdcvpfygq.supabase.co';
var SUPABASE_KEY = 'sb_publishable_GL4Ad1Su5zfZo-K5ocqtSw_4I7j_fdy';
var _client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

var SECTEUR_ROUTES = {
  'Restauration': '/diagnostic-restauration',
  'Commerce':     '/diagnostic-commerce',
  'Garage':       '/diagnostic-garage'
};

var diagUrl = '/diagnostic-restauration'; // fallback
var entrepriseName = '';

async function init() {
  try {
    var { data: { user } } = await _client.auth.getUser();
    if (!user) { window.location.href = '/connexion'; return; }

    var secteur  = user.user_metadata && user.user_metadata.secteur  ? user.user_metadata.secteur  : '';
    entrepriseName = user.user_metadata && user.user_metadata.entreprise ? user.user_metadata.entreprise : '';

    if (secteur && SECTEUR_ROUTES[secteur]) {
      diagUrl = SECTEUR_ROUTES[secteur];
    }
  } catch(e) {}

  renderCard();
}

function renderCard() {
  document.getElementById('card').innerHTML = `
    <div class="welcome-label">Votre espace Clearisk est prêt</div>
    <div class="welcome-title">Bienvenue,<br><strong>${entrepriseName || 'sur Clearisk'}</strong></div>
    <div class="welcome-sub">Comment voulez-vous démarrer ?</div>
    <div class="divider"></div>
    <div class="question">Choisissez votre point de départ</div>
    <div class="choices">
      <button class="choice choice-primary" onclick="window.location.href='${diagUrl}'">
        <span class="choice-badge">Recommandé</span>
        <div class="choice-title">Répondre au diagnostic</div>
        <div class="choice-sub">Environ 10 minutes pour identifier automatiquement vos risques, calculer votre score de résilience et générer un plan d'action personnalisé.</div>
      </button>
      <button class="choice choice-secondary" onclick="window.location.href='/dashboard'">
        <div class="choice-title">Accéder directement à mon dashboard</div>
        <div class="choice-sub">Accès libre à la bibliothèque de risques de votre secteur. Ajoutez manuellement ceux qui vous concernent.</div>
      </button>
    </div>
  `;
}

init();

var modalContents = {
  mentions: { title: "Mentions légales" },
  privacy:  { title: "Politique de confidentialité" },
  cgu:      { title: "CGU / CGV" },
  cookies:  { title: "Politique de cookies" }
};
function openModal(key) {
  var c = modalContents[key];
  if (!c) return;
  document.getElementById('modalContent').innerHTML = '<h2>' + c.title + '</h2>';
  document.getElementById('modalOverlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeModal() {
  document.getElementById('modalOverlay').classList.remove('open');
  document.body.style.overflow = '';
}
function closeModalOutside(e) {
  if (e.target === document.getElementById('modalOverlay')) closeModal();
}
document.addEventListener('keydown', function(e) { if (e.key === 'Escape') closeModal(); });
</script>

</body>
</html>
